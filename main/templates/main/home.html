{% extends "main/base.html" %}
{% load static %}

{% block content %}
<style>
  /* Vidéo plein écran */
  .hero-video {
    position: relative;
    width: 50%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-video video {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    object-fit: contain; /* Affiche la vidéo complète sans couper */
    object-position: center center; /* Centre le contenu */
    z-index: -1;
  }

  /* Contenu par-dessus la vidéo */
  .hero-content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    background: rgba(7, 6, 6, 0.35);
    padding: 20px;
    border-radius: 10px;
  }

  .hero-content h1 {
    font-size: 3em;
    margin-bottom: 10px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 200;
  }

  .hero-content p {
    font-size: 1.5em;
    margin-bottom: 20px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 200;
  }

  .btn-light {
    padding: 10px 20px;
    background-color: #ffffffcc;
    color: #000;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 200;
    transition: 0.3s;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .btn-light:hover {
    background-color: transparent;
    color: white;
  }

  /* Section produits */
  .main-section {
    padding: 60px 20px;
    text-align: center;
  }

  .main-section h2 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 200;
    font-size: 2.5em;
    margin-bottom: 20px;
    color: #2c2c2c;
  }

  .main-section p {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 200;
    font-size: 1.2em;
    color: #555;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .hero-video {
      width: 90%;
      height: 70vh;
    }
    
    .hero-content h1 {
      font-size: 2em;
    }
    
    .hero-content p {
      font-size: 1.2em;
    }
    
    .main-section h2 {
      font-size: 2em;
    }
  }
</style>

<!-- Section vidéo -->
<section class="hero-video">
  <video autoplay muted loop playsinline>
    <source src="{% static 'videos/hero.mp4' %}" type="video/mp4">
    Votre navigateur ne supporte pas la vidéo.
  </video>

  <div class="hero-content">
    <h1>Bienvenue sur notre boutique</h1>
    <p>Découvrez nos articles exclusifs</p>
    <a href="{% url 'product' %}" class="btn-light">Voir les produits</a>
  </div>
</section>

<!-- Section produits -->
<section class="main-section">
  <h2>Nos Produits</h2>
  <p>Explorez notre collection ci-dessous.</p>
</section>
{% endblock %}
