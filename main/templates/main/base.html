{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ma Boutique{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
            background: #f9f9f9;
            color: #2c2c2c;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            background: #ffffff;
            color: #2c2c2c;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }
        
        /* --- Icône Menu Hamburger --- */
       
        
        .hamburger-menu:hover {
            background: rgba(0,0,0,0.1);
            transform: translateY(-1px);
        }
        
      .hamburger-menu {
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* Revenons à space-between */
    width: 40px;
    height: 34px; /* Augmentons légèrement la hauteur */
    gap: 02px; /* Ajoutons un gap pour forcer l'espacement */
}

.hamburger-line {
    width: 100%;
    height: 3px;
    background: #2c2c2c;
    border-radius: 2px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: block;
    flex-shrink: 0; /* Empêche la compression des lignes */
}
        
        /* .hamburger-menu:hover .hamburger-line {
            background: #667eea;
        } */
        
        /* Animation when menu is active */
        .hamburger-menu.active .hamburger-line:nth-child(1) {
            transform: rotate(360deg) translate(6px, 6px);
        }
        
        .hamburger-menu.active .hamburger-line:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger-menu.active .hamburger-line:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }
        
        .header-right a, .header-right button {
            color: #2c2c2c;
            text-decoration: none;
            font-weight: 200;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .header-right a:hover, .header-right button:hover {
            background: rgba(0,0,0,0.1);
            transform: translateY(-1px);
        }
        .header-center a {
            color: #2c2c2c;
            text-decoration: none;
            font-size: 50px;
            font-weight: 200;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            letter-spacing: -1px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #ffeaa7, #fd79a8, #6c5ce7);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: circularRotate 4s linear infinite, rainbowShimmer 3s ease-in-out infinite, sparkle 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.5));
            transform-origin: center center;
        }
        /* --- Menu latéral --- */
        #menuPanel {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #ffffff;
            color: #2c2c2c;
            box-shadow: 4px 0 30px rgba(0,0,0,0.3);
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        #menuPanel.active { left: 0; }
        #menuHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            font-weight: 200;
            font-size: 18px;
            color: #2c2c2c;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #menuHeader button {
            background: none;
            border: none;
            color: #2c2c2c;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
        }
        #menuHeader button:hover { transform: rotate(90deg); }
        #menuItems { flex: 1; display: flex; flex-direction: column; padding: 15px; }
        #menuItems a {
            color: #2c2c2c;
            text-decoration: none;
            margin-bottom: 8px;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 200;
            position: relative;
            transition: all 0.3s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #menuItems a:hover {
            color: #2c2c2c;
            background: rgba(0,0,0,0.1);
            transform: translateX(6px);
        }

        /* --- Panier --- */
        #cartPanel {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            height: 100%;
            background: #ffffff;
            box-shadow: -10px 0 50px rgba(0,0,0,0.15);
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            border-left: 1px solid rgba(0,0,0,0.08);
        }
        #cartPanel.active { right: 0; }
        #cartHeader {
            background: #f8f8f8;
            padding: 25px;
            font-size: 20px;
            font-weight: 200;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #cartHeader button {
            background: rgba(0,0,0,0.05);
            border: none;
            font-size: 18px;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
        }
        #cartHeader button:hover {
            background: rgba(255,0,0,0.1);
            color: #ff4757;
            transform: scale(1.1);
        }

        #cartItems {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .cartItem {
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            padding: 20px 0;
            min-height: 140px;
            transition: all 0.3s ease;
        }
        .cartItem:last-child { border-bottom: none; }
        .cartItem img {
            width: 110px;
            height: 130px;
            object-fit: cover;
            margin-right: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            transition: all 0.3s ease;
        }
        .cartItemDetails { 
            flex: 1; 
            font-size: 14px; 
            padding-top: 8px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
        }
        .cartItemDetails p { 
            margin: 6px 0; 
            color: #555; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
        }
        .cartItemDetails strong { 
            font-size: 16px; 
            color: #1a1a1a; 
            font-weight: 200; 
            margin-bottom: 8px; 
            display: block;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .qtyControls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            background: #f4f4f4;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .qtyControls button {
            padding: 6px 12px;
            border: none;
            background: #ffffff;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 200;
            color: #333;
            transition: all 0.3s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .qtyControls button:hover {
            background: #667eea;
            color: white;
        }
        .qtyControls span {
            padding: 6px 12px;
            font-weight: 200;
            min-width: 32px;
            text-align: center;
            background: white;
            border-radius: 6px;
            color: #1a1a1a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        #cartTotal {
            padding: 25px;
            background: #f8f8f8;
            font-weight: 200;
            font-size: 18px;
            text-align: right;
            border-top: 1px solid rgba(0,0,0,0.08);
            color: #1a1a1a;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        #viewCartInPanel, #checkoutBtn {
            width: calc(100% - 50px);
            margin: 10px 25px;
            padding: 16px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 200;
            transition: all 0.3s ease;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        #viewCartInPanel {
            background: #edafdf;
            color: white;
        }
        #viewCartInPanel:hover { background: #5a6edc; }
        #checkoutBtn {
            background: #1a1a1a;
            color: white;
        }
        #checkoutBtn:hover { background: #333333; }

        /* Message panier vide */
        .empty-cart-message {
            text-align: center;
            color: #999;
            padding: 60px 30px;
            font-style: italic;
            font-size: 16px;
            background: #f8f8f8;
            border-radius: 12px;
            margin: 20px;
            border: 2px dashed #e0e0e0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
            font-size: 18px;
        }
        #openCart{
            background-color:#F7E1D7;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #cartPanel { width: 100vw; right: -100vw; }
            header { padding: 15px 20px; }
            .header-center a { 
                font-size: 26px; 
                padding-left: 20px;
            }
        }
        
        /* Footer */
        .footer {
            background: #111;
            padding: 25px 15px;
            text-align: center;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
            margin-top: auto; /* Pousse le footer en bas */
        }

        .footer-content {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .social-link img {
            width: 35px;
            height: 35px;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: brightness(0) invert(1);
        }

        .social-link img:hover {
            transform: scale(1.2) rotate(5deg);
            filter: brightness(1) invert(0) drop-shadow(0 0 10px #fff);
        }

        .footer-text {
            font-size: 14px;
            color: #aaa;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 200;
        }

        /* Contenu principal */
        .content {
            flex: 1 0 auto;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div id="openMenu" class="hamburger-menu">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </div>
    </div>
    <div class="header-center">
        <a href="/"><img src="{% static 'photos/maison bella-02.png' %}" alt="Maison Bella Logo" style="height: 50px; width: auto;"></a>
    </div>
    <div class="header-right">
        <a href="help">Help</a>
        <button id="openCart">Panier (<span id="cartCount">0</span>)</button>
    </div>
</header>

<!-- Menu latéral -->
<div id="menuPanel">
    <div id="menuHeader">
        <span>Navigation</span>
        <button onclick="toggleMenu()">✕</button>
    </div>
    <div id="menuItems">
        <a href="/">Accueil</a>
        <a href="{% url 'category' 'new' %}">New</a>
        <a href="{% url 'product' %}">All Products</a>
        <a href="{% url 'category' 'everyday' %}">Everyday</a>
        <a href="{% url 'category' 'hijab' %}">Hijab</a>
        <a href="{% url 'category' 'tops' %}">Tops</a>
        <a href="{% url 'category' 'pants' %}">Pants</a>
        <a href="{% url 'category' 'dress' %}">Dress</a>
        <a href="{% url 'help' %}">Help</a>
    </div>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

<!-- Panier -->
<div id="cartPanel">
    <div id="cartHeader">
        <span>Votre Panier</span>
        <button onclick="toggleCart()">×</button>
    </div>
    <div id="cartItems"></div>
    <div id="cartTotal">Total: 0 DA</div>
    <button id="viewCartInPanel" onclick="clickclick()">Voir le Panier</button>
    <button id="checkoutBtn" onclick="passerCommande()">Passer la commande</button>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="footer-content">
        <a href="https://www.instagram.com/maison_bella.alg/#" target="_blank" class="social-link">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
        </a>
        <a href="https://www.tiktok.com/@maison_bella" target="_blank" class="social-link">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046122.png" alt="TikTok">
        </a>
        <a href="mailto:contact@maison-bella.com" class="social-link">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Email">
        </a>
    </div>
    <p class="footer-text">© 2025 Maison Bella – Tous droits réservés</p>
</footer>

<script>
    const menuPanel = document.getElementById('menuPanel');
    const hamburgerMenu = document.getElementById('openMenu');
    
    hamburgerMenu.addEventListener('click', () => {
        menuPanel.classList.toggle('active');
        hamburgerMenu.classList.toggle('active');
    });
    
    function toggleMenu() { 
        menuPanel.classList.remove('active'); 
        hamburgerMenu.classList.remove('active');
    }

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartPanel = document.getElementById('cartPanel');
    const cartCount = document.getElementById('cartCount');

    document.getElementById('openCart').addEventListener('click', () => { cartPanel.classList.toggle('active'); renderCart(); });

    function calculateCartTotal() {
        return cart.reduce((total, item) => total + (parseFloat(item.price)||0)*(parseInt(item.quantity)||0), 0);
    }

    function renderCart() {
        cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartItemsDiv = document.getElementById('cartItems');
        cartItemsDiv.innerHTML = '';

        if(cart.length > 0){
            cart.forEach((item,index)=>{
                const imageUrl = item.image || 'https://via.placeholder.com/110x130';
                cartItemsDiv.innerHTML += `
                    <div class="cartItem">
                        <img src="${imageUrl}" alt="${item.name}">
                        <div class="cartItemDetails">
                            <strong>${item.name}</strong>
                            <p>Taille: <span>${item.size}</span></p>
                            <p>${parseFloat(item.price||0).toFixed(2)} DA</p>
                            <div class="qtyControls">
                                <button onclick="changeQty(${index},-1)">−</button>
                                <span>${item.quantity||0}</span>
                                <button onclick="changeQty(${index},1)">+</button>
                                <button onclick="removeItem(${index})">×</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        } else {
            cartItemsDiv.innerHTML = '<div class="empty-cart-message">Votre panier est vide<br><small>Ajoutez des produits pour commencer vos achats</small></div>';
        }

        const totalCount = cart.reduce((sum,i)=>sum+(parseInt(i.quantity)||0),0);
        const totalPrice = calculateCartTotal();
        cartCount.textContent = totalCount;
        document.getElementById('cartTotal').innerHTML = `<div>Total</div><div>${totalPrice.toFixed(2)} DA</div>`;
        cartCount.style.display = totalCount>0?'inline':'none';
    }

    function changeQty(index,delta){
        if(cart[index]){
            cart[index].quantity = (parseInt(cart[index].quantity)||0)+delta;
            if(cart[index].quantity <=0) cart.splice(index,1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }
    }
    function removeItem(index){
        cart.splice(index,1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }
    function addToCart(id,name,size,price,image){
        cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existing = cart.find(item=>item.id==id && item.size===size);
        if(existing) existing.quantity = (parseInt(existing.quantity)||0)+1;
        else cart.push({id:parseInt(id),name,size,price:parseFloat(price),image,quantity:1});
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }
    function passerCommande(){
        const currentCart = JSON.parse(localStorage.getItem('cart')) || [];
        if(currentCart.length===0){ alert('Votre panier est vide !'); return; }
        window.location.href = "{% url 'commande' %}";
    }
    function clickclick(){ window.location.href='/voir'; }
    function toggleCart() { cartPanel.classList.remove('active'); }
    renderCart();

    // Fermer le panier en cliquant à l'extérieur
    document.addEventListener('click', function(event){
        if(cartPanel.classList.contains('active') && !cartPanel.contains(event.target) && !document.getElementById('openCart').contains(event.target)){
            cartPanel.classList.remove('active');
        }
        
        // Fermer le menu en cliquant à l'extérieur
        if(menuPanel.classList.contains('active') && !menuPanel.contains(event.target) && !hamburgerMenu.contains(event.target)){
            menuPanel.classList.remove('active');
            hamburgerMenu.classList.remove('active');
        }
    });
</script>

</body>
</html>
